# Managed using Terraform
name: Close Stale Pull Requests

on:
  schedule:
    - cron: '0 8 * * *' # Run every day at 8:00 AM

jobs:
  close_stale_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close Stale Pull Requests
        # https://github.com/actions/stale
        uses: actions/stale@v10.2.0
        with:
          days-before-pr-stale: 30
          days-before-pr-close: 3
          stale-pr-message: 'This pull request has been marked as stale because it has been inactive for more than 30 day(s). Please update this pull request by pushing a commit or by submitting a comment or it will be automatically closed in 3 day(s)'
          close-pr-message: 'This pull request was closed because it has been stalled for 33 day(s) with no activity.'
          stale-pr-label: stale
          close-pr-label: closed
